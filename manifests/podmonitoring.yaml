# Tells Google Cloud Managed Service for Prometheus to scrape Kepler.
# Metrics then show up in Cloud Monitoring > Metrics Explorer (PromQL tab).
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: kepler
  namespace: kepler
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kepler
  endpoints:
    - port: http
      interval: 15s
